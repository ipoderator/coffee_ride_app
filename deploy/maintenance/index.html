<!doctype html>
<!--
  CR-265: the reverse proxy's own fallback page. `deploy/Caddyfile` serves it with
  503 + Retry-After whenever `web` cannot answer (a restart while maintenance is
  switched on or off, a deploy, a crash), so it depends on nothing — no Next, API,
  database, fonts or external files. Planned maintenance itself is rendered by
  apps/web (`MAINTENANCE_MODE`, `SystemStatusScreen`); this copy follows it by hand:
  the texts from packages/ui's `SYSTEM_STATUS_TERMS`, the colours from
  `packages/ui/src/tokens.css`, the contact from `apps/web/src/lib/site/contact.ts`.
-->
<html lang="ru" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Технические работы — Coffee Ride</title>
    <script>
      // The viewer's theme, as apps/web's THEME_INIT_SCRIPT reads it (dark by default).
      try {
        var stored = window.localStorage.getItem('coffee-ride-theme');
        var dark =
          stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored !== 'light';
        if (!dark) document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f1f5;
        --surface: #f8f6f9;
        --text: #17141a;
        --text-secondary: #413c47;
        --text-muted: #5a5460;
        --frame: #17141a;
        --primary: #74597e;
        --brand: #82668c;
        --primary-fill: #82668c;
        --primary-fill-hover: #6c5376;
        --on-primary-fill: #ffffff;
        --warning-fill: #ffc94d;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #121015;
        --surface: #25212a;
        --text: #f3f0f5;
        --text-secondary: #c7c0cc;
        --text-muted: #a39ca9;
        --frame: #f3f0f5;
        --primary: #b8a0c1;
        --brand: #b8a0c1;
        --primary-fill: #82668c;
        --primary-fill-hover: #93779d;
        --on-primary-fill: #ffffff;
        --warning-fill: #f0c04e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--text);
        background: var(--bg);
        font-family:
          'Golos Text',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: radial-gradient(
          circle at 50% 20%,
          color-mix(in srgb, var(--primary-fill) 18%, transparent),
          transparent 34rem
        );
      }
      .card {
        width: min(100%, 760px);
        text-align: center;
      }
      .wordmark {
        display: inline-flex;
        align-items: baseline;
        margin-bottom: 24px;
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .wordmark svg {
        fill: var(--brand);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      h1 {
        margin: 0;
        font-family: Unbounded, system-ui, sans-serif;
        font-size: clamp(2rem, 1.1rem + 3.2vw, 3.25rem);
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 590px;
        margin: 18px auto 0;
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.55;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 20px;
        border: 1.5px solid var(--frame);
        border-radius: 999px;
        color: var(--text);
        background: transparent;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--surface);
      }
      .btn:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .btn-primary {
        padding: 0 26px;
        border-color: transparent;
        color: var(--on-primary-fill);
        background: var(--primary-fill);
      }
      .btn-primary:hover {
        background: var(--primary-fill-hover);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        color: var(--text-muted);
        font-size: 0.9375rem;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--warning-fill);
      }
      @media (max-width: 640px) {
        main {
          padding: 24px 20px 64px;
        }
      }
      @media (min-width: 768px) {
        .btn {
          min-height: 44px;
          font-size: 0.9375rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <span class="wordmark">
          <span class="sr-only">Кофе Райд</span>
          <span aria-hidden="true">
            <svg viewBox="0 0 40 20" width="35" height="17.6" focusable="false">
              <path
                d="M0.4 20C0.4 17 2.6 14.2 5.8 14.1C8 14 9 14.8 10.6 14.4C13.4 13.7 15.6 7.8 20.6 7.6C23 7.5 24.2 8.8 25.8 8C28.8 6.5 31.4 0 35.8 0C38.2 0 40 1.8 40 4.2V19.2C40 19.6 39.6 20 39.2 20Z"
              /></svg
            >&#8239;кофе<svg
              viewBox="0 0 10 10"
              width="5.3"
              height="5.3"
              focusable="false"
              style="margin: 0 0.07em; transform: translateY(-0.15em)"
            >
              <circle cx="5" cy="5" r="5" /></svg
            >райд
          </span>
        </span>
        <h1>Технический пит-стоп. Скоро снова в путь.</h1>
        <p>
          Мы обновляем Кофе Райд, чтобы сервис работал стабильнее. Ваши
          аккаунты, регистрации и заезды сохранены.
        </p>
        <div class="actions">
          <button
            type="button"
            class="btn btn-primary"
            onclick="location.reload()"
          >
            Обновить страницу
          </button>
          <a class="btn" href="mailto:glebchurkin48@gmail.com">Написать нам</a>
        </div>
        <div class="status">
          <span class="dot" aria-hidden="true"></span>Технические работы
        </div>
      </div>
    </main>
  </body>
</html>
