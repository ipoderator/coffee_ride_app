# Local development infrastructure only.
#
# Every port is bound to 127.0.0.1 deliberately: on a machine with a public IP a bare
# "5432:5432" publishes Postgres/Redis/MinIO to the internet. Do not widen these
# bindings — if a service must be reachable from another host, put it behind the
# reverse proxy instead.
#
# This file is not a production manifest — see docs/tasks.md → Deployment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_ride
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coffee_ride']
      interval: 5s
      timeout: 5s
      retries: 10

  # KI-003: requirepass + AOF persistence. Dev-only literal password (same
  # pattern as postgres/minio below, this file is local-dev-only and bound to
  # 127.0.0.1) — without AOF a container restart silently drops queued
  # notification jobs (CR-050), which .claude/rules/resilience.md forbids.
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass redis-dev-only --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          'redis-dev-only',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Image comes from quay.io, not Docker Hub's minio/minio: MinIO's own docs
  # (docs/docker/README.md in minio/minio) reference quay.io/minio/minio exclusively now.
  # Pinned to a specific RELEASE tag rather than :latest so dev/CI/server don't drift
  # (KI-005). The healthcheck uses `mc ready local`, not curl: the server image does not
  # ship curl, and `mc` is bundled — this is MinIO's own documented healthcheck, taken
  # verbatim from their official docker-compose example (KI-004).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # CR-129 (KI-015): a fresh `minio_data` volume has no bucket, so `/health`
  # reported `s3: "error"` and every upload showed «Загрузка недоступна» until
  # someone ran `mc mb` by hand. One-shot: waits for `minio` to be healthy,
  # creates `.env.example`'s `S3_BUCKET` if missing, exits 0. Same image as
  # `minio` (it bundles `mc`), so no extra image to pin. Runs with a plain
  # `docker compose up -d`; after `up -d minio` alone, add `minio-init`.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minio minio12345 && mc mb --ignore-existing local/coffee-ride
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
