# Local development infrastructure only.
#
# Every port is bound to 127.0.0.1 deliberately: on a machine with a public IP a bare
# "5432:5432" publishes Postgres/Redis/S3 to the internet. Do not widen these
# bindings — if a service must be reachable from another host, put it behind the
# reverse proxy instead.
#
# This file is not a production manifest — see docs/tasks.md → Deployment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_ride
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coffee_ride']
      interval: 5s
      timeout: 5s
      retries: 10

  # KI-003: requirepass + AOF persistence. Dev-only literal password (same
  # pattern as postgres/s3 below, this file is local-dev-only and bound to
  # 127.0.0.1) — without AOF a container restart silently drops queued
  # notification jobs (CR-050), which .claude/rules/resilience.md forbids.
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass redis-dev-only --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          'redis-dev-only',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store (ADR-005; SeaweedFS since CR-140/ADR-025 —
  # MinIO's images stopped being publicly pullable, KI-068). Same pinned image
  # as ci.yml's `s3` service so dev and CI don't drift (KI-005); pulled from
  # ghcr.io, not Docker Hub. The image's default CMD `mini -dir=/data` runs
  # master+volume+filer+S3 in one process; S3 listens on 8333 and takes its
  # admin credentials from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (the same
  # dev-only `minio`/`minio12345` pair `.env.example`'s S3_* use). `/healthz`
  # is the one unauthenticated S3 endpoint; the image ships busybox wget.
  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - s3_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8333/healthz',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # CR-129 (KI-015): a fresh `s3_data` volume has no bucket, so `/health`
  # reported `s3: "error"` and every upload showed «Загрузка недоступна» until
  # someone created it by hand. One-shot: waits for `s3` to be healthy,
  # creates `.env.example`'s `S3_BUCKET` (`s3.bucket.create` is a no-op on an
  # existing bucket), exits 0. Same image as `s3`, so no extra image to pin.
  # Runs with a plain `docker compose up -d`; after `up -d s3` alone, add
  # `s3-init`.
  s3-init:
    image: ghcr.io/chrislusf/seaweedfs:4.47
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - echo 's3.bucket.create -name coffee-ride' | weed shell -master=s3:9333
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  s3_data:
