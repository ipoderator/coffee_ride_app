# Local development infrastructure only.
#
# Every port is bound to 127.0.0.1 deliberately: on a machine with a public IP a bare
# "5432:5432" publishes Postgres/Redis/MinIO to the internet. Do not widen these
# bindings — if a service must be reachable from another host, put it behind the
# reverse proxy instead.
#
# This file is not a production manifest — see docs/tasks.md → Deployment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_ride
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffee_ride"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
