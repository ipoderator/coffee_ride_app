# CR-218, ADR-031. Data services on the same host as the application — an overlay
# for docker-compose.prod.yml, never used on its own:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.infra.yml ...
#
# `deploy/deploy.sh` runs the whole sequence. docker-compose.prod.yml stays free of
# data services (ADR-018), so moving to managed Postgres/Redis/S3 later means
# dropping this file and setting DATABASE_URL/REDIS_URL/S3_* in `.env` instead.
#
# None of these services publishes a port: they are reachable only on the compose
# network, by `api`, `migrate` and `backup`. Their URLs are derived here from the
# passwords in `.env` and override whatever DATABASE_URL/REDIS_URL/S3_ENDPOINT says
# there. Generate the passwords with `openssl rand -hex 32` — hex, because they go
# into URLs unescaped.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-database-url: &database-url postgresql://coffee_ride:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/coffee_ride

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: coffee_ride
      POSTGRES_USER: coffee_ride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffee_ride -d coffee_ride']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # BullMQ needs `noeviction`: an evicted job key is a lost notification. The memory
  # cap is for the rate-limit counters and the queue, both small.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    environment:
      # redis-cli reads it, so the healthcheck needs no password argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # S3-compatible object storage — the same SeaweedFS image local development and CI
  # use (ADR-025). The bucket stays private; `api` proxies every object (ADR-019).
  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *default-logging
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - s3_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8333/healthz',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # One-shot: creates the bucket. Safe to re-run — creating an existing bucket is
  # reported and ignored, and the container still exits 0.
  s3-init:
    image: ghcr.io/chrislusf/seaweedfs:4.48
    restart: 'no'
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=s3:9333

  api:
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  migrate:
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  s3_data:
