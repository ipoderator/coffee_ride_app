packages:
  - apps/*
  - packages/*
allowBuilds:
  argon2: true
# CR-191. eslint-config-next's `parser.js` does `require('next/dist/compiled/
# babel/eslint-parser')` but the package declares no dependency on `next`, so
# under pnpm's strict layout it only resolved through pnpm's private hoist
# (node_modules/.pnpm/node_modules, reached via NODE_PATH). Declaring `next` as
# its peer makes pnpm link apps/web's own `next` beside eslint-config-next,
# independent of hoisting (and of `hoist=false`).
packageExtensions:
  eslint-config-next:
    peerDependencies:
      next: '*'
# CR-214. drizzle-kit 0.31 still loads configs through the deprecated
# @esbuild-kit/esm-loader, whose core-utils pins esbuild ^0.18 (GHSA-67mh-4wv8-2f99,
# fixed in 0.25.0). drizzle-kit itself already depends on esbuild ^0.25.4; lift the
# esbuild-kit copy to the same range. Drop once drizzle-kit stops using esbuild-kit.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.4
# CR-214 supply-chain hardening (Semgrep pnpm rules). Transitive deps may only come
# from the registry, and a version may not lose the trust evidence (provenance/trusted
# publishing) its predecessors had. No `minimumReleaseAge`: Dependabot's updater
# re-resolves the whole tree, so any locked version younger than the window failed
# every npm update job — and security updates, which skip `cooldown` by design, would
# always fail. Dependabot's `cooldown` delays version updates instead (CR-215).
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Old releases published before their maintainers adopted provenance, already pinned
# by integrity in the lockfile (a fresh resolution fails on them otherwise). Exact
# versions only — a newer release of either still gets the check.
trustPolicyExclude:
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'semver@6.3.1'
