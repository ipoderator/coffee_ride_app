version: 2
# CR-214: wait a week before proposing a freshly published version (security
# updates are exempt). This is the release-age delay; pnpm's `minimumReleaseAge`
# breaks Dependabot's own resolution (CR-215).
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # KI-072: minor/patch only. A major in the group (TypeScript 7 in PR #24,
      # which typescript-eslint refused to run under) failed CI and held back
      # every unrelated patch with it; majors now arrive as their own PRs.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # eslint-config-next's major tracks Next's: 16 fails to lint under the
      # pinned Next 15 (PR #27, "Converting circular structure to JSON"). Bump
      # it together with `next` when migrating to Next 16 (PR #22).
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # CR-082: 'docker' only scans a Dockerfile in the exact `directory` given,
  # no subdirectory recursion — the previous single `directory: '/'` entry
  # pointed at a location with no Dockerfile at all (all three live nested)
  # and never actually scanned anything. One entry per real Dockerfile.
  - package-ecosystem: 'docker'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/packages/db'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # 'docker-compose' is a separate ecosystem from 'docker' (GA Feb 2025) —
  # covers docker-compose.yml/docker-compose.prod.yml's `image:` references
  # (postgres/redis/seaweedfs/caddy), which no 'docker' entry above reaches.
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
