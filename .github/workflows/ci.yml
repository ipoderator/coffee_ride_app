name: CI

on:
  pull_request:
    # labeled/unlabeled: the coverage gate reads the
    # `coverage-decrease-approved` label (CR-136), so adding or removing it
    # has to re-run the job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coffee_ride
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coffee_ride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      # CR-140 (ADR-025, KI-068). S3-compatible store, same pinned image as
      # docker-compose.yml's `s3` service. SeaweedFS, not MinIO: MinIO's
      # images are no longer publicly pullable, and a `services:` entry
      # can't pass MinIO's required `server /data` anyway. This image's
      # default CMD (`mini -dir=/data`) already serves S3 on 8333 and takes
      # its admin credentials from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
      # Pulled from ghcr.io, not Docker Hub (anonymous rate limits). A fresh
      # container has no bucket — see the "Create S3 bucket" step.
      s3:
        image: ghcr.io/chrislusf/seaweedfs:4.47
        env:
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio12345
        ports:
          - 9000:8333
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8333/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffee_ride
      # CR-096/KI-049. apps/api's own test suite reads TEST_DATABASE_URL, never
      # DATABASE_URL, so a real database can never leak into it — see
      # apps/api/src/test-support/test-database-url.ts. Same disposable
      # per-run `postgres` service as DATABASE_URL above; deliberately not
      # just reusing DATABASE_URL so the two stay structurally independent.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffee_ride
      REDIS_URL: redis://localhost:6379
      # CR-080. apps/api's own test suite builds its `env` objects directly
      # (never reads these), but the Playwright e2e job below boots a real
      # `apps/api` process via `server.ts`, which does — AUTH_SECRET/
      # WEB_ORIGIN were never needed in this job before that existed.
      AUTH_SECRET: ci-only-secret-not-for-production
      WEB_ORIGIN: http://localhost:3000
      # CR-080/KI-015. Matches the bucket the "Create S3 bucket" step
      # below creates. Configuring these makes both `pnpm test`'s new
      # route-storage.live.test.ts (skips itself when unset — see that
      # file) and the e2e job's real GPX-upload paths exercise a real,
      # live S3-compatible store instead of staying permanently unverified
      # (KI-015 has been open since CR-006 for exactly this reason).
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_BUCKET: coffee-ride-ci
      # route-storage.live.test.ts's own explicit opt-in — see that file's
      # comment for why S3_* alone isn't a safe enough signal (a local .env
      # has them configured for the local S3 service whether or not it is running).
      RUN_LIVE_S3_TESTS: '1'
      # CR-137: queue.live.test.ts — the notification queue's happy path
      # against the `redis` service above (the unit tests mock ioredis).
      RUN_LIVE_REDIS_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json → packageManager. Do not also pass
      # `version:` here: action-setup fails when the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First real DB consumer (CR-011) — the `postgres` service above starts
      # empty; apps/api's auth tests need the real schema applied, the same
      # way a real deploy would (`packages/db/src/migrate.ts`, CR-076's
      # eventual deploy-time step).
      - name: Run database migrations
        run: pnpm --filter db db:migrate

      # CR-080/KI-015. The S3 service starts with no buckets — aws-cli ships
      # preinstalled on ubuntu-latest runners, so no extra container/binary
      # is needed just to run one `s3 mb` against the service's root
      # credentials (real AWS creds are never involved — --endpoint-url
      # points this at the local S3 service, not real AWS).
      - name: Create S3 bucket
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://coffee-ride-ci
        env:
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio12345
          AWS_DEFAULT_REGION: us-east-1

      - name: Format check
        run: pnpm format:check

      - name: Lint (root config)
        run: pnpm lint:root

      - name: Lint (workspaces)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # CR-136. Same suites as `pnpm test`, with v8 coverage; each package
      # writes coverage/ (html, lcov, json-summary).
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

      # CR-136. Fails when any package total or gated API module drops below
      # coverage-baseline.json; the table goes to the job summary. On a PR the
      # base branch's baseline is a floor too, so lowering the file in the
      # same PR doesn't pass — unless the PR carries the
      # `coverage-decrease-approved` label (e.g. well-tested code removed).
      - name: Coverage gate
        env:
          COVERAGE_ALLOW_DECREASE: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-decrease-approved') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$RUNNER_TEMP/coverage-baseline.base.json"
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            git show FETCH_HEAD:coverage-baseline.json > "$base" 2>/dev/null || rm -f "$base"
            pnpm coverage:check --base "$base"
          else
            pnpm coverage:check
          fi

      - name: Build
        run: pnpm build

      # CR-080/KI-007. Wired in for the first time — playwright.config.ts's
      # webServer array starts a real apps/api (this job's real, migrated
      # Postgres + the env above) and a real apps/web `next dev` in order,
      # so this is a genuine end-to-end check, not a static-page smoke test.
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # CR-138. Previously nothing was uploaded for a failed e2e run at all —
      # a failing `toHaveScreenshot` (or any other e2e failure) had no way to
      # inspect what actually rendered/diffed without reproducing locally.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # CR-134. Builds the real production images (docker-compose.prod.yml) and
  # requires GET /api/v1/rides through `web` to reach `api` over the Compose
  # network — guards the web → api proxy target, which is baked in at
  # `next build` and once pointed at localhost:4000 inside the web container.
  # Separate job: needs no Node/pnpm setup or the `ci` job's host-port
  # services, and runs in parallel with it.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Production Docker smoke test
        run: bash deploy/smoke/run.sh
