<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Кофе-райд — групповые велозаезды с кофе">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82668C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#82668C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#F3F1F5"/>
    <g stroke="#DDD7E1" stroke-width="1">
      <path d="M0 140H1200M0 200H1200M0 260H1200M0 320H1200" stroke-dasharray="2 8"/>
    </g>

    <!-- wordmark -->
    <g transform="translate(60 58)">
      <path d="M0.4 20C0.4 17 2.6 14.2 5.8 14.1C8 14 9 14.8 10.6 14.4C13.4 13.7 15.6 7.8 20.6 7.6C23 7.5 24.2 8.8 25.8 8C28.8 6.5 31.4 0 35.8 0C38.2 0 40 1.8 40 4.2V19.2C40 19.6 39.6 20 39.2 20Z" transform="scale(1.9)" fill="#82668C"/>
      <text x="92" y="36" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#17141A">кофе<tspan fill="#82668C">·</tspan>райд</text>
    </g>
    <text x="60" y="140" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#17141A">Групповые велозаезды с кофе</text>
    <text x="60" y="172" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#5A5460">Найди заезд по темпу — или собери свою группу.</text>

    <!-- elevation profile -->
    <path d="M40 330 C110 330 150 300 220 296 S320 312 390 276 S480 196 560 210 S660 286 740 256 S850 150 930 146 S1030 214 1090 236 S1140 250 1160 250 L1160 380 L40 380Z" fill="url(#fade)">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.55;.92;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path id="route" d="M40 330 C110 330 150 300 220 296 S320 312 390 276 S480 196 560 210 S660 286 740 256 S850 150 930 146 S1030 214 1090 236 S1140 250 1160 250" pathLength="1000" fill="none" stroke="#82668C" stroke-width="4" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.6;.92;1" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- start / finish labels -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#5A5460">
      <text x="40" y="358">СТАРТ · 07:00</text>
      <text x="1160" y="226" text-anchor="end">ФИНИШ · 64 КМ</text>
    </g>

    <!-- coffee stop on the summit -->
    <g transform="translate(930 146)">
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#82668C" stroke-width="2" stroke-dasharray="3 4"/>
      <g transform="translate(-22 -84)">
        <rect x="-10" y="-10" width="64" height="62" rx="16" fill="#FFFFFF" stroke="#DDD7E1"/>
        <path d="M4 14H32V30C32 37 26 42 19 42H17C10 42 4 37 4 30Z" fill="#82668C"/>
        <path d="M32 19H35C38.5 19 41 21.5 41 25S38.5 31 35 31H32" fill="none" stroke="#82668C" stroke-width="3"/>
        <g fill="none" stroke="#5A5460" stroke-width="2" stroke-linecap="round">
          <path d="M11 9C9 6 13 4 11 0">
            <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 3;0 -3" dur="2.4s" repeatCount="indefinite"/>
          </path>
          <path d="M18 9C16 6 20 4 18 0">
            <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 3;0 -3" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
          </path>
          <path d="M25 9C23 6 27 4 25 0">
            <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 3;0 -3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
      <text x="44" y="-50" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#5A5460">КОФЕ-СТОП · 41 КМ</text>
    </g>

    <!-- the rider -->
    <g>
      <circle r="16" fill="#82668C" opacity=".25">
        <animate attributeName="r" values="8;20;8" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".35;0;.35" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#82668C" stroke="#FFFFFF" stroke-width="3"/>
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;.6;.92;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
    </g>
  </g>
</svg>
