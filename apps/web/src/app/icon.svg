<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- ADR-021 («Топокарта»): the wordmark's ring alone, in the overprint
       colour. A static asset cannot read packages/ui's CSS tokens, so the two
       `--primary` values (light #7A2482 / dark #D79BE0) are repeated here;
       keep them in step with packages/ui/src/tokens.css. -->
  <style>
    circle { stroke: #7a2482; }
    @media (prefers-color-scheme: dark) { circle { stroke: #d79be0; } }
  </style>
  <circle cx="8" cy="8" r="5.75" fill="none" stroke-width="2.5" />
</svg>
